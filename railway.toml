[build]
builder = "nixpacks"
buildCommand = "npm install && npm run --workspace=packages/db generate && npm run build --workspace=apps/web"

[deploy]
startCommand = "npm run --workspace=packages/db migrate:deploy && npm run start --workspace=apps/web"
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
