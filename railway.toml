[build]
builder = "nixpacks"
buildCommand = "npm install && npx prisma generate --schema=packages/db/prisma/schema.prisma && npm run build --workspace=apps/web"

[deploy]
startCommand = "npx prisma migrate deploy --schema=packages/db/prisma/schema.prisma && npm run start --workspace=apps/web"
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "on-failure"
restartPolicyMaxRetries = 3
